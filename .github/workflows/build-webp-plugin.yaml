name: Build WebP Native Plugins
# Builds the webp-unity native plugin from upstream libwebp source
# for all supported Unity target platforms.
#
# Trigger manually or on changes to the WebP plugin directory.
# Artifacts are committed back to the PR branch.

on:
  workflow_dispatch:
  push:
    branches:
      - 'feat/webp-texture-support'
      - 'fix/webp-global-addon-registration'
    paths:
      - 'Runtime/WebP/Plugin/**'
      - '.github/workflows/build-webp-plugin.yaml'

jobs:
  build-android-arm64:
    name: Android ARM64 (Quest)
    runs-on: ubuntu-latest
    env:
      LIBWEBP_VERSION: "v1.5.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Clone libwebp source
        run: |
          git clone --depth 1 --branch ${{ env.LIBWEBP_VERSION }} \
            https://chromium.googlesource.com/webm/libwebp /tmp/libwebp

      - name: Set up Android NDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      # Build static libs, then link a single self-contained shared library.
      # A shared libwebp build depends on a separate libsharpyuv.so that Unity
      # never ships, causing DllNotFoundException at runtime.
      - name: Build for Android ARM64
        run: |
          cd /tmp/libwebp
          mkdir build && cd build
          cmake \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DWEBP_BUILD_EXTRAS=OFF \
            -DWEBP_BUILD_ANIM_UTILS=OFF \
            -DWEBP_BUILD_CWEBP=OFF \
            -DWEBP_BUILD_DWEBP=OFF \
            -DWEBP_BUILD_GIF2WEBP=OFF \
            -DWEBP_BUILD_IMG2WEBP=OFF \
            -DWEBP_BUILD_VWEBP=OFF \
            -DWEBP_BUILD_WEBPINFO=OFF \
            -DWEBP_BUILD_WEBPMUX=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            ..
          cmake --build . --parallel
          $ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang \
            -shared -o libwebp-unity.so \
            -Wl,-soname,libwebp-unity.so \
            -Wl,--whole-archive libwebp.a -Wl,--no-whole-archive libsharpyuv.a \
            -lm
          # verify: no non-system dynamic dependencies
          $ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf -d libwebp-unity.so | grep NEEDED
          ! $ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf -d libwebp-unity.so | grep NEEDED | grep -E 'libwebp\.so|libsharpyuv'

      - name: Copy binary to plugin directory
        run: |
          mkdir -p Runtime/WebP/Plugin/Android/arm64-v8a
          cp /tmp/libwebp/build/libwebp-unity.so \
            Runtime/WebP/Plugin/Android/arm64-v8a/libwebp-unity.so

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: webp-android-arm64
          path: Runtime/WebP/Plugin/Android/arm64-v8a/libwebp-unity.so

  build-linux-x86_64:
    name: Linux x86-64
    runs-on: ubuntu-latest
    env:
      LIBWEBP_VERSION: "v1.5.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Clone libwebp source
        run: |
          git clone --depth 1 --branch ${{ env.LIBWEBP_VERSION }} \
            https://chromium.googlesource.com/webm/libwebp /tmp/libwebp

      # Build static libs, then link a single self-contained shared library
      # (a shared libwebp depends on a separate libsharpyuv.so that never ships).
      - name: Build for Linux x86-64
        run: |
          cd /tmp/libwebp
          mkdir build && cd build
          cmake \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DWEBP_BUILD_EXTRAS=OFF \
            -DWEBP_BUILD_ANIM_UTILS=OFF \
            -DWEBP_BUILD_CWEBP=OFF \
            -DWEBP_BUILD_DWEBP=OFF \
            -DWEBP_BUILD_GIF2WEBP=OFF \
            -DWEBP_BUILD_IMG2WEBP=OFF \
            -DWEBP_BUILD_VWEBP=OFF \
            -DWEBP_BUILD_WEBPINFO=OFF \
            -DWEBP_BUILD_WEBPMUX=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            ..
          cmake --build . --parallel
          cc -shared -o libwebp-unity.so \
            -Wl,-soname,libwebp-unity.so \
            -Wl,--whole-archive libwebp.a -Wl,--no-whole-archive libsharpyuv.a \
            -lm
          # verify: no non-system dynamic dependencies
          readelf -d libwebp-unity.so | grep NEEDED
          ! readelf -d libwebp-unity.so | grep NEEDED | grep -E 'libwebp\.so|libsharpyuv'

      - name: Copy binary to plugin directory
        run: |
          mkdir -p Runtime/WebP/Plugin/Linux/x86_64
          cp /tmp/libwebp/build/libwebp-unity.so \
            Runtime/WebP/Plugin/Linux/x86_64/libwebp-unity.so

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: webp-linux-x86_64
          path: Runtime/WebP/Plugin/Linux/x86_64/libwebp-unity.so

  build-macos-universal:
    name: macOS Universal (arm64 + x86_64)
    runs-on: macos-latest
    env:
      LIBWEBP_VERSION: "v1.5.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Clone libwebp source
        run: |
          git clone --depth 1 --branch ${{ env.LIBWEBP_VERSION }} \
            https://chromium.googlesource.com/webm/libwebp /tmp/libwebp

      # Build static libs per-arch (a fat static build breaks libwebp's SIMD flag
      # detection), then link self-contained per-arch dylibs and lipo them together.
      # A shared libwebp build depends on a separate libsharpyuv dylib that never
      # ships, causing DllNotFoundException at runtime.
      - name: Build for macOS (arm64 + x86_64)
        run: |
          cd /tmp/libwebp
          for arch in arm64 x86_64; do
            cmake -B build-$arch \
              -DCMAKE_OSX_ARCHITECTURES=$arch \
              -DBUILD_SHARED_LIBS=OFF \
              -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
              -DWEBP_BUILD_EXTRAS=OFF \
              -DWEBP_BUILD_ANIM_UTILS=OFF \
              -DWEBP_BUILD_CWEBP=OFF \
              -DWEBP_BUILD_DWEBP=OFF \
              -DWEBP_BUILD_GIF2WEBP=OFF \
              -DWEBP_BUILD_IMG2WEBP=OFF \
              -DWEBP_BUILD_VWEBP=OFF \
              -DWEBP_BUILD_WEBPINFO=OFF \
              -DWEBP_BUILD_WEBPMUX=OFF \
              -DCMAKE_BUILD_TYPE=Release
            cmake --build build-$arch --parallel
            cc -dynamiclib -arch $arch -o webp-unity-$arch.dylib \
              -Wl,-force_load,build-$arch/libwebp.a build-$arch/libsharpyuv.a \
              -install_name @rpath/webp-unity.bundle
          done

      - name: Create universal binary bundle
        run: |
          mkdir -p Runtime/WebP/Plugin/macOS
          lipo -create \
            /tmp/libwebp/webp-unity-arm64.dylib \
            /tmp/libwebp/webp-unity-x86_64.dylib \
            -output Runtime/WebP/Plugin/macOS/webp-unity.bundle
          # verify: self-contained (only libSystem) and exports present
          otool -L Runtime/WebP/Plugin/macOS/webp-unity.bundle
          ! otool -L Runtime/WebP/Plugin/macOS/webp-unity.bundle | grep -E 'libsharpyuv|libwebp\.'
          nm -gU Runtime/WebP/Plugin/macOS/webp-unity.bundle | grep -q _WebPGetInfo

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: webp-macos-universal
          path: Runtime/WebP/Plugin/macOS/webp-unity.bundle

  build-windows-x86_64:
    name: Windows x86-64
    runs-on: windows-latest
    env:
      LIBWEBP_VERSION: "v1.5.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Clone libwebp source
        run: |
          git clone --depth 1 --branch ${{ env.LIBWEBP_VERSION }} `
            https://chromium.googlesource.com/webm/libwebp C:\libwebp

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      # Build static libs, then link a single self-contained DLL exporting the
      # two functions the C# side P/Invokes (a shared libwebp build depends on
      # a separate libsharpyuv.dll that never ships).
      - name: Build for Windows x86-64
        run: |
          cd C:\libwebp
          mkdir build && cd build
          cmake -A x64 `
            -DBUILD_SHARED_LIBS=OFF `
            -DWEBP_BUILD_EXTRAS=OFF `
            -DWEBP_BUILD_ANIM_UTILS=OFF `
            -DWEBP_BUILD_CWEBP=OFF `
            -DWEBP_BUILD_DWEBP=OFF `
            -DWEBP_BUILD_GIF2WEBP=OFF `
            -DWEBP_BUILD_IMG2WEBP=OFF `
            -DWEBP_BUILD_VWEBP=OFF `
            -DWEBP_BUILD_WEBPINFO=OFF `
            -DWEBP_BUILD_WEBPMUX=OFF `
            -DCMAKE_BUILD_TYPE=Release `
            ..
          cmake --build . --config Release --parallel
          link /DLL /OUT:webp-unity.dll `
            Release\libwebp.lib Release\libsharpyuv.lib `
            /EXPORT:WebPGetInfo /EXPORT:WebPDecodeRGBAInto
          if (-not $?) { exit 1 }
          # verify: no libwebp/libsharpyuv dynamic dependency remains
          dumpbin /dependents webp-unity.dll
          $deps = dumpbin /dependents webp-unity.dll | Out-String
          if ($deps -match 'libwebp\.dll|libsharpyuv\.dll') { exit 1 }

      - name: Copy binary to plugin directory
        run: |
          New-Item -ItemType Directory -Force `
            -Path Runtime\WebP\Plugin\Windows\x86_64
          Copy-Item C:\libwebp\build\webp-unity.dll `
            Runtime\WebP\Plugin\Windows\x86_64\webp-unity.dll

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: webp-windows-x86_64
          path: Runtime/WebP/Plugin/Windows/x86_64/webp-unity.dll

  build-ios-arm64:
    name: iOS ARM64
    runs-on: macos-latest
    env:
      LIBWEBP_VERSION: "v1.5.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Clone libwebp source
        run: |
          git clone --depth 1 --branch ${{ env.LIBWEBP_VERSION }} \
            https://chromium.googlesource.com/webm/libwebp /tmp/libwebp

      - name: Build for iOS (arm64)
        run: |
          cd /tmp/libwebp
          mkdir build-ios && cd build-ios
          cmake \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DWEBP_BUILD_EXTRAS=OFF \
            -DWEBP_BUILD_ANIM_UTILS=OFF \
            -DWEBP_BUILD_CWEBP=OFF \
            -DWEBP_BUILD_DWEBP=OFF \
            -DWEBP_BUILD_GIF2WEBP=OFF \
            -DWEBP_BUILD_IMG2WEBP=OFF \
            -DWEBP_BUILD_VWEBP=OFF \
            -DWEBP_BUILD_WEBPINFO=OFF \
            -DWEBP_BUILD_WEBPMUX=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            ..
          cmake --build . --parallel
          libtool -static -o libwebp-unity.a libwebp.a libsharpyuv.a

      - name: Copy binary to plugin directory
        run: |
          mkdir -p Runtime/WebP/Plugin/iOS
          cp /tmp/libwebp/build-ios/libwebp-unity.a \
            Runtime/WebP/Plugin/iOS/libwebp-unity.a

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: webp-ios-arm64
          path: Runtime/WebP/Plugin/iOS/libwebp-unity.a

  # Collects all platform binaries and commits them to the branch
  commit-binaries:
    name: Commit plugin binaries
    needs: [build-android-arm64, build-ios-arm64, build-linux-x86_64, build-macos-universal, build-windows-x86_64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.ref }}

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: /tmp/artifacts

      - name: Place binaries in plugin directories
        run: |
          # Android ARM64
          mkdir -p Runtime/WebP/Plugin/Android/arm64-v8a
          cp /tmp/artifacts/webp-android-arm64/libwebp-unity.so \
            Runtime/WebP/Plugin/Android/arm64-v8a/libwebp-unity.so

          # Linux x86-64
          mkdir -p Runtime/WebP/Plugin/Linux/x86_64
          cp /tmp/artifacts/webp-linux-x86_64/libwebp-unity.so \
            Runtime/WebP/Plugin/Linux/x86_64/libwebp-unity.so

          # macOS universal
          mkdir -p Runtime/WebP/Plugin/macOS
          cp /tmp/artifacts/webp-macos-universal/webp-unity.bundle \
            Runtime/WebP/Plugin/macOS/webp-unity.bundle

          # Windows x86-64
          mkdir -p Runtime/WebP/Plugin/Windows/x86_64
          cp /tmp/artifacts/webp-windows-x86_64/webp-unity.dll \
            Runtime/WebP/Plugin/Windows/x86_64/webp-unity.dll

          # iOS ARM64
          mkdir -p Runtime/WebP/Plugin/iOS
          cp /tmp/artifacts/webp-ios-arm64/libwebp-unity.a \
            Runtime/WebP/Plugin/iOS/libwebp-unity.a

      - name: Commit updated binaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Runtime/WebP/Plugin/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "build: update WebP native plugin binaries [skip ci]"
            git push
          fi
